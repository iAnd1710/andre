services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "3001:3000"

    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - nuxt_build:/app/.nuxt

    environment:
      HOST: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"

    stdin_open: true
    tty: true

volumes:
  node_modules:
  nuxt_build:
